# Configuración del panel de edición (Decap CMS).

backend:
  name: github
  repo: mariocb1/colesanroque
  branch: main
  base_url: https://decap-proxy.mariocb12.workers.dev
  auth_endpoint: auth

media_folder: assets/uploads
public_folder: /assets/uploads
publish_mode: simple

collections:
  - name: contenido
    label: "Contenido de la web"
    files:
      - name: ajustes
        label: "Textos generales"
        file: data/ajustes.json
        format: json
        fields:
          - {label: "Lema", name: lema, widget: string}
          - {label: "Subtítulo", name: subtitulo, widget: string}
          - {label: "Dirección", name: direccion, widget: string}
          - {label: "Teléfono", name: telefono, widget: string}
          - {label: "Email", name: email, widget: string}
          - {label: "Menú del comedor", name: menu_comedor, widget: text}
          - {label: "Libro del mes", name: libro_mes, widget: text}
          - {label: "Calendario escolar (texto)", name: calendario_texto, widget: text}
          - {label: "Buzón de sugerencias (texto)", name: buzon_texto, widget: text}
          - {label: "Calendario de Google: dirección de inserción (opcional)", name: calendario_google, widget: string, required: false}

      - name: portada
        label: "Portada: cuántas se ven"
        file: data/portada.json
        format: json
        fields:
          - label: "Configuración"
            name: items
            widget: list
            add_to_top: true
            summary: "Desde {{fields.desde}}: {{fields.noticias}} noticias, {{fields.entradas}} entradas"
            fields:
              - {label: "Desde el día", name: desde, widget: datetime, date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD"}
              - {label: "Noticias en portada", name: noticias, widget: number, value_type: int, default: 3}
              - {label: "Entradas de blog en portada", name: entradas, widget: number, value_type: int, default: 3}

      - name: avisos
        label: "Avisos y plazos"
        file: data/avisos.json
        format: json
        fields:
          - label: "Avisos"
            name: items
            widget: list
            add_to_top: true
            summary: "{{fields.texto}}"
            fields:
              - {label: "Fecha límite", name: fecha_limite, widget: datetime, date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD"}
              - {label: "Texto", name: texto, widget: string}
              - {label: "Urgente", name: urgente, widget: boolean, default: false}
              - {label: "Página de detalle (opcional): texto completo", name: detalle, widget: text, required: false}
              - {label: "Enlace externo (opcional)", name: enlace, widget: string, required: false}

      - name: noticias
        label: "Noticias"
        file: data/noticias.json
        format: json
        fields:
          - label: "Noticias"
            name: items
            widget: list
            add_to_top: true
            summary: "{{fields.titulo}}"
            fields:
              - {label: "Fecha", name: fecha, widget: datetime, date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD"}
              - {label: "Título", name: titulo, widget: string}
              - {label: "Resumen", name: resumen, widget: text}
              - {label: "Etiqueta", name: etiqueta, widget: string, required: false}
              - {label: "Emoji (si no hay foto)", name: emoji, widget: string, required: false}
              - {label: "Foto (opcional)", name: imagen, widget: image, required: false}
              - {label: "Texto completo (separa párrafos con una línea en blanco)", name: texto, widget: text, required: false}
              - label: "Galería de fotos (opcional)"
                name: galeria
                widget: list
                add_to_top: true
                required: false
                fields:
                  - {label: "Foto", name: foto, widget: image}
              - label: "Enlaces a otras webs (opcional)"
                name: enlaces
                widget: list
                add_to_top: true
                required: false
                fields:
                  - {label: "Texto del enlace", name: texto, widget: string}
                  - {label: "Dirección (URL)", name: url, widget: string}
              - {label: "Enlace externo principal (opcional, botón \"Más información\")", name: enlace, widget: string, required: false}
              - label: "Estado"
                name: estado
                widget: select
                default: "Portada"
                options: ["Portada", "Archivo", "Borrador"]

      - name: blog
        label: "Blog de aula"
        file: data/blog.json
        format: json
        fields:
          - label: "Entradas"
            name: items
            widget: list
            add_to_top: true
            summary: "{{fields.titulo}}"
            fields:
              - {label: "Fecha", name: fecha, widget: datetime, date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD"}
              - {label: "Título", name: titulo, widget: string}
              - {label: "Resumen (para la tarjeta)", name: resumen, widget: text, required: false}
              - {label: "Texto completo (separa párrafos con una línea en blanco)", name: texto, widget: text}
              - label: "Galería de fotos (opcional)"
                name: galeria
                widget: list
                add_to_top: true
                required: false
                fields:
                  - {label: "Foto", name: foto, widget: image}
              - label: "Enlaces a otras webs (opcional)"
                name: enlaces
                widget: list
                add_to_top: true
                required: false
                fields:
                  - {label: "Texto del enlace", name: texto, widget: string}
                  - {label: "Dirección (URL)", name: url, widget: string}
              - {label: "Etiqueta", name: etiqueta, widget: string, required: false}
              - {label: "Emoji (si no hay foto)", name: emoji, widget: string, required: false}
              - {label: "Foto (opcional)", name: imagen, widget: image, required: false}
              - label: "Estado"
                name: estado
                widget: select
                default: "Portada"
                options: ["Portada", "Archivo", "Borrador"]

      - name: programas
        label: "Planes y programas"
        file: data/programas.json
        format: json
        fields:
          - label: "Programas"
            name: items
            widget: list
            add_to_top: true
            summary: "{{fields.nombre}}"
            fields:
              - {label: "Nombre", name: nombre, widget: string}
              - {label: "Grupo (p. ej. Proyectos del centro)", name: grupo, widget: string}
              - {label: "Emoji", name: emoji, widget: string}
              - {label: "Resumen corto", name: resumen, widget: string}
              - {label: "Descripción completa", name: detalle, widget: text}
              - {label: "Coordina", name: coordina, widget: string}
              - {label: "Enlace (opcional)", name: enlace, widget: string, required: false}

      - name: servicios
        label: "Servicios"
        file: data/servicios.json
        format: json
        fields:
          - label: "Servicios"
            name: items
            widget: list
            add_to_top: true
            summary: "{{fields.nombre}}"
            fields:
              - {label: "Nombre", name: nombre, widget: string}
              - {label: "Emoji", name: emoji, widget: string}
              - {label: "Descripción", name: descripcion, widget: string}

      - name: docentes
        label: "Equipo docente"
        file: data/docentes.json
        format: json
        fields:
          - label: "Docentes"
            name: items
            widget: list
            add_to_top: true
            summary: "{{fields.nombre}}"
            fields:
              - {label: "Nombre", name: nombre, widget: string}
              - {label: "Cargo (cada función en una línea)", name: cargo, widget: text}
              - label: "Etapa"
                name: etapa
                widget: select
                options: ["Equipo directivo", "Infantil", "Primaria", "Especialistas", "Apoyo"]
              - {label: "Foto (opcional)", name: foto, widget: image, required: false}

      - name: fichas
        label: "Recursos (fichas)"
        file: data/fichas.json
        format: json
        fields:
          - label: "Fichas"
            name: items
            widget: list
            add_to_top: true
            summary: "{{fields.titulo}}"
            fields:
              - label: "Curso"
                name: curso
                widget: select
                options: ["3 años", "4 años", "5 años", "1º", "2º", "3º", "4º", "5º", "6º"]
              - {label: "Asignatura o área", name: area, widget: string}
              - label: "Tema (opcional)"
                name: unidad
                widget: select
                required: false
                options: ["Tema 1", "Tema 2", "Tema 3", "Tema 4", "Tema 5", "Tema 6", "Tema 7", "Tema 8", "Tema 9", "Tema 10", "Tema 11", "Tema 12"]
              - {label: "Título", name: titulo, widget: string}
              - label: "Archivo de la ficha (HTML)"
                name: enlace
                widget: file
                media_folder: assets/fichas
                public_folder: /assets/fichas
